<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weight Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #171c24; color: #e6ebf1; font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased; padding: clamp(28px,5vw,72px) clamp(20px,5vw,64px); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: #5fa8d8; }
  .meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.5px; color: #8d97a3; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; flex-wrap: wrap; border-bottom: 2px solid #5fa8d8; padding-bottom: 18px; margin-bottom: clamp(32px,5vw,56px); }
  .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: clamp(32px,5vw,64px); align-items: end; margin-bottom: clamp(36px,5vw,56px); }
  .big { display: flex; align-items: baseline; gap: 12px; }
  .big b { font-size: clamp(84px,11vw,132px); line-height: 0.84; font-weight: 300; letter-spacing: -0.04em; color: #5fa8d8; }
  .big span { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 1.5px; color: #8d97a3; padding-bottom: 14px; }
  .caption { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #8d97a3; margin-top: 14px; line-height: 1.7; }
  .register { display: flex; flex-direction: column; background: #1e242e; padding: clamp(18px,3vw,26px) clamp(20px,3vw,28px); border-left: 3px solid #5fa8d8; }
  .register div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; border-bottom: 1px solid #2c343f; }
  .register div:last-child { border-bottom: none; }
  .register dt { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #8d97a3; }
  .register dd { font-size: 26px; white-space: nowrap; }
  .progress { margin-bottom: clamp(36px,5vw,52px); }
  .progress .labels { display: flex; justify-content: space-between; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #8d97a3; margin-bottom: 9px; }
  .progress .track { position: relative; height: 8px; background: #2c343f; }
  .progress .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg,#e0a93f,#5fa8d8); }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .chart-head .right { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; }
  .tabs button { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 6px 13px; min-height: 32px; cursor: pointer; border: 1px solid #39424e; background: transparent; color: #8d97a3; }
  .tabs button.on { border-color: #5fa8d8; background: #5fa8d8; color: #101419; }
  .chart { height: clamp(240px,32vw,320px); position: relative; }
  section.block { margin-top: clamp(40px,5vw,56px); padding-top: 24px; border-top: 2px solid #5fa8d8; }
  .block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .cols { column-gap: clamp(24px,4vw,48px); }
  #weekly { columns: 300px; }
  #milestones { columns: 330px; }
  .week-row { display: grid; grid-template-columns: 76px 1fr auto; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid #262d38; break-inside: avoid; }
  .ms-row { display: grid; grid-template-columns: auto 62px 1fr auto; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px solid #262d38; break-inside: avoid; }
  .k { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #8d97a3; white-space: nowrap; }
  .v { font-size: 20px; }
  .d { font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: nowrap; }
  .ms-w { font-size: 22px; }
  .ms-l { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: #79838f; }
  .ms-d { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8d97a3; white-space: nowrap; }
  a { color: #5fa8d8; text-decoration: none; }
  a:hover { color: #e6ebf1; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Weight Record</div>
    <div class="meta" id="headMeta"></div>
  </header>

  <div class="hero">
    <div>
      <div class="big"><b id="displayWeight"></b><span>LBS</span></div>
      <div class="caption" id="caption"></div>
    </div>
    <div class="register" id="register"></div>
  </div>

  <div class="progress">
    <div class="labels">
      <span id="pStart"></span><span id="pPct"></span><span id="pGoal"></span>
    </div>
    <div class="track"><div class="fill" id="pFill"></div></div>
  </div>

  <div class="chart-head">
    <div class="eyebrow">Measured weight, seven-day mean and projection</div>
    <div class="right">
      <div class="meta" id="etaLabel"></div>
      <div class="tabs" id="tabs">
        <button data-range="30">30d</button>
        <button data-range="90">90d</button>
        <button data-range="all" class="on">All</button>
      </div>
    </div>
  </div>
  <div class="chart"><canvas id="chart"></canvas></div>

  <section class="block">
    <div class="block-head">
      <div class="eyebrow">Weekly averages</div>
      <div class="meta">Last twelve weeks</div>
    </div>
    <div class="cols" id="weekly"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <div class="eyebrow">Milestones</div>
      <div class="meta">Recorded, and projected at present trend</div>
    </div>
    <div class="cols" id="milestones"></div>
  </section>
</div>

`;

const rawData = WEIGHT_LOG.split("\n")
  .map(row => row.trim().split(/[\s,\t]+/))
  .filter(c => /^\d{4}-\d{2}-\d{2}$/.test(c[0]) && !isNaN(parseFloat(c[1])))
  .map(c => [c[0], parseFloat(c[1])])
  .sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);

const GOAL = 160;
const HEIGHT_INCHES = 71;

const MILESTONES = [
  { w: 255, label: 'Starting weight' },
  { w: 240, label: 'First fifteen' },
  { w: 220, label: 'Daily tracking begins' },
  { w: 210, label: 'Forty-five down' },
  { w: 200, label: 'Under two hundred' },
  { w: 190, label: 'Sixty-five down' },
  { w: 185, label: 'Seventy down' },
  { w: 180, label: 'Into the one-seventies' },
  { w: 175, label: 'Eighty down' },
  { w: 170, label: 'Into the one-sixties' },
  { w: 165, label: 'Ninety down' },
  { w: 160, label: 'Target weight' },
  { w: 155, label: 'One hundred down' }
];

const DAY = 86400000;
const dshort = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const dlong = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

const log = rawData.slice().sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
const dates = log.map(d => new Date(d[0] + 'T12:00:00'));
const weights = log.map(d => d[1]);
const t0 = dates[0].getTime();
const xs = dates.map(d => (d.getTime() - t0) / DAY);
const n = xs.length;
const sX = xs.reduce((a, b) => a + b, 0), sY = weights.reduce((a, b) => a + b, 0);
const sXY = xs.reduce((a, x, i) => a + x * weights[i], 0);
const sXX = xs.reduce((a, x) => a + x * x, 0);
const slope = (n * sXY - sX * sY) / (n * sXX - sX * sX);
const intercept = (sY - slope * sX) / n;
const trend = xs.map(x => intercept + slope * x);
const ratePerDay = Math.abs(slope);
const movingAvg = weights.map((w, i) => {
  if (i < 6) return null;
  let s = 0; for (let j = i - 6; j <= i; j++) s += weights[j];
  return +(s / 7).toFixed(1);
});
const lastDate = dates[dates.length - 1];
const lastTrend = intercept + slope * xs[xs.length - 1];
const ma = movingAvg.filter(v => v !== null);
const displayWeight = ma[ma.length - 1];
const startWeight = weights[0];
const totalLost = startWeight - displayWeight;
const toGo = displayWeight - GOAL;
const pct = Math.min((totalLost / (startWeight - GOAL)) * 100, 100);
const daysToGoal = (lastTrend - GOAL) / ratePerDay;
const eta = new Date(lastDate.getTime() + daysToGoal * DAY);
const bmi = (703 * displayWeight) / (HEIGHT_INCHES * HEIGHT_INCHES);
const lowest = Math.min.apply(null, weights);
const cutoff = lastDate.getTime() - 28 * DAY;
const recent = log.filter(d => new Date(d[0] + 'T12:00:00').getTime() >= cutoff);
const recentRate = (recent[0][1] - recent[recent.length - 1][1]) / 4;

const projDates = [], projWeights = [];
for (let d = 0; d <= daysToGoal + 6; d += 3) {
  const pw = lastTrend + slope * d;
  if (pw >= GOAL - 1) { projDates.push(new Date(lastDate.getTime() + d * DAY)); projWeights.push(+pw.toFixed(1)); }
}

document.getElementById('headMeta').textContent =
  'Day ' + Math.round(xs[xs.length - 1]) + ' · ' + log.length + ' entries · ' + dlong(lastDate);
document.getElementById('displayWeight').textContent = displayWeight.toFixed(1);
document.getElementById('caption').textContent =
  'Seven-day mean · ' + weights[weights.length - 1].toFixed(1) + ' lbs last measured';

document.getElementById('register').innerHTML = [
  ['Total reduction', totalLost.toFixed(1) + ' lbs'],
  ['Remaining to ' + GOAL, toGo.toFixed(1) + ' lbs'],
  ['Rate, 4 weeks', recentRate.toFixed(1) + ' lbs/wk'],
  ['Trend, overall', (ratePerDay * 7).toFixed(1) + ' lbs/wk'],
  ['Lowest measured', lowest.toFixed(1) + ' lbs'],
  ['Body mass index', bmi.toFixed(1)]
].map(r => '<div><span class="dt">' + r[0] + '</span><span class="dd">' + r[1] + '</span></div>')
 .join('').replace(/class="dt"/g, 'class="k" style="letter-spacing:2px;text-transform:uppercase;font-size:10px"')
 .replace(/class="dd"/g, 'style="font-size:26px;white-space:nowrap"');

document.getElementById('pStart').textContent = startWeight;
document.getElementById('pGoal').textContent = GOAL;
document.getElementById('pPct').textContent = pct.toFixed(1) + '% of the way to ' + GOAL;
document.getElementById('pFill').style.width = pct.toFixed(1) + '%';
document.getElementById('etaLabel').textContent = 'Goal projected ' + dlong(eta);

const buckets = {};
log.forEach(([ds, w]) => {
  const d = new Date(ds + 'T12:00:00');
  const ws = new Date(d); ws.setDate(d.getDate() - d.getDay());
  const k = ws.toISOString().slice(0, 10);
  (buckets[k] = buckets[k] || []).push(w);
});
const keys = Object.keys(buckets).sort();
const avgOf = k => buckets[k].reduce((a, b) => a + b, 0) / buckets[k].length;
document.getElementById('weekly').innerHTML = keys.map((k, i) => {
  const avg = avgOf(k);
  const ch = i > 0 ? avg - avgOf(keys[i - 1]) : null;
  const color = ch === null ? '#79838f' : ch < 0 ? '#5fa8d8' : '#e0a93f';
  const label = ch === null ? '—' : (ch > 0 ? '+' : '−') + Math.abs(ch).toFixed(1);
  return '<div class="week-row"><span class="k">' + dshort(new Date(k + 'T12:00:00')) +
    '</span><span class="v">' + avg.toFixed(1) +
    '</span><span class="d" style="color:' + color + '">' + label + '</span></div>';
}).reverse().slice(0, 12).join('');

document.getElementById('milestones').innerHTML = MILESTONES.map(m => {
  const achieved = displayWeight <= m.w;
  let dateStr = '';
  if (achieved) {
    const hit = log.find(d => d[1] <= m.w);
    if (hit) dateStr = dlong(new Date(hit[0] + 'T12:00:00'));
  } else {
    const days = (lastTrend - m.w) / ratePerDay;
    if (days > 0) dateStr = dlong(new Date(lastDate.getTime() + days * DAY));
  }
  return '<div class="ms-row"><span class="k" style="color:' + (achieved ? '#5fa8d8' : '#454e5a') + '">' +
    (achieved ? '■' : '□') + '</span><span class="ms-w" style="color:' + (achieved ? '#e6ebf1' : '#79838f') + '">' +
    m.w + '</span><span class="ms-l">' + m.label + '</span><span class="ms-d">' + dateStr + '</span></div>';
}).join('');

function series(range) {
  let d = dates, w = weights, tr = trend, mav = movingAvg;
  if (range !== 'all') {
    const cut = lastDate.getTime() - parseInt(range) * DAY;
    const i = dates.findIndex(x => x.getTime() >= cut);
    d = d.slice(i); w = w.slice(i); tr = tr.slice(i); mav = mav.slice(i);
  }
  const pd = range === 'all' ? projDates : [];
  const pw = range === 'all' ? projWeights : [];
  const pl = pd.length;
  const vis = w.concat(pw).filter(v => v !== null).concat(range === 'all' ? [GOAL] : []);
  return {
    labels: d.concat(pd).map(dshort),
    daily: w.concat(Array(pl).fill(null)),
    mean: mav.concat(Array(pl).fill(null)),
    trend: tr.map(v => +v.toFixed(1)).concat(Array(pl).fill(null)),
    proj: Array(w.length).fill(null).concat(pw),
    target: Array(w.length + pl).fill(GOAL),
    yMin: Math.floor(Math.min.apply(null, vis) / 5) * 5 - 3,
    yMax: Math.ceil(Math.max.apply(null, vis) / 5) * 5 + 3
  };
}

let chart = null;
function draw(range) {
  const s = series(range);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart').getContext('2d'), {
    type: 'line',
    data: {
      labels: s.labels,
      datasets: [
        { label: 'Measured', data: s.daily, borderColor: 'rgba(95,168,216,0.25)', borderWidth: 1, pointRadius: 0, tension: 0.15, fill: false },
        { label: 'Seven-day mean', data: s.mean, borderColor: '#5fa8d8', borderWidth: 2.5, pointRadius: 0, tension: 0.3, fill: true, backgroundColor: 'rgba(95,168,216,0.09)' },
        { label: 'Trend', data: s.trend, borderColor: 'rgba(226,232,240,0.28)', borderWidth: 1, borderDash: [5,4], pointRadius: 0, fill: false },
        { label: 'Projection', data: s.proj, borderColor: '#e0a93f', borderWidth: 1.5, borderDash: [2,4], pointRadius: 0, fill: false },
        { label: 'Goal', data: s.target, borderColor: 'rgba(224,169,63,0.45)', borderWidth: 1, pointRadius: 0, fill: false }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#1e242e', titleColor: '#e6ebf1', bodyColor: '#e6ebf1', borderWidth: 0, cornerRadius: 2, padding: 10, titleFont: { family: 'IBM Plex Mono', size: 11 }, bodyFont: { family: 'IBM Plex Mono', size: 11 } }
      },
      scales: {
        x: { border: { display: false }, ticks: { color: '#79838f', font: { family: 'IBM Plex Mono', size: 10 }, maxTicksLimit: 10, maxRotation: 0, autoSkipPadding: 20 }, grid: { display: false } },
        y: { min: s.yMin, max: s.yMax, border: { display: false }, ticks: { color: '#79838f', font: { family: 'IBM Plex Mono', size: 10 }, stepSize: 10 }, grid: { color: 'rgba(255,255,255,0.06)' } }
      }
    }
  });
}
draw('all');

document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    draw(b.dataset.range);
  });
});
</script>
</body>
